services:
  print-forwarder:
    build: .
    image: cups-print-forwarder:latest
    container_name: cups-print-forwarder
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # Flask
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      # CUPS — points to the Docker host so the container can reach the
      # CUPS daemon running on the host machine.
      - CUPS_HOST=${CUPS_HOST:-host.docker.internal}
      - CUPS_PORT=${CUPS_PORT:-631}
      - CUPS_PRINTER=${CUPS_PRINTER:-}
      # LibreOffice
      - LIBREOFFICE_BIN=soffice
      # Service restart — override for Docker (requires --pid=host + privileged):
      #   nsenter -t 1 -m -u -i -n -- systemctl restart cups-browsed
      - RESTART_CUPS_BROWSED_CMD=${RESTART_CUPS_BROWSED_CMD:-systemctl restart cups-browsed}
    # Allows "host.docker.internal" to resolve on Linux Docker hosts.
    # On Docker Desktop (Mac/Windows) this is handled automatically.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Uncomment the two lines below to allow the Services tab to restart
    # cups-browsed on the host via nsenter (set RESTART_CUPS_BROWSED_CMD above).
    #pid: host
    #privileged: true
